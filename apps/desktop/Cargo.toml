[package]
name = "specto-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Specto for the desktop: a document viewer and light editor with GTK 4"

[[bin]]
name = "specto-gtk"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
# The system's gettext (part of glibc on Linux, Homebrew's on macOS), never
# the copy of GNU gettext the crate would otherwise build on macOS.
gettext-rs = { version = "0.8", features = ["gettext-system"] }
specto-annot.workspace = true
specto-doc.workspace = true
specto-geom.workspace = true
specto-render.workspace = true
specto-session.workspace = true
specto-source.workspace = true
specto-write.workspace = true
specto-view.workspace = true

[lints]
workspace = true
