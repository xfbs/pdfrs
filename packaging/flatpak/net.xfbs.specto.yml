# Flatpak manifest for the desktop app. Build and install it locally with
# packaging/flatpak/build.sh (see packaging/README.md).
id: net.xfbs.specto
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: specto-gtk
# The translations stay in the app. Split off into an extension, they would be
# missing from the bundles of a release, which hold the app alone.
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # No file system access: files come through the file chooser, drag and
  # drop and "Open With", which hand the app just those files.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/specto/cargo
    CARGO_NET_OFFLINE: "true"
modules:
  - name: specto
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p specto-desktop
      - install -Dm755 target/release/specto-gtk -t /app/bin
      - apps/desktop/po/install.sh /app/share/locale
      - install -Dm644 apps/desktop/data/net.xfbs.specto.desktop -t /app/share/applications
      - install -Dm644 apps/desktop/data/net.xfbs.specto.metainfo.xml -t /app/share/metainfo
      - install -Dm644 apps/desktop/data/icons/net.xfbs.specto.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 apps/desktop/data/icons/net.xfbs.specto-symbolic.svg -t /app/share/icons/hicolor/symbolic/apps
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - apps/android
          - packaging/flatpak/cargo-sources.json
      - cargo-sources.json
