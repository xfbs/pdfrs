name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Compiler warnings fail the build.
  RUSTFLAGS: -D warnings

jobs:
  check:
    # The Rust code: formatting, lints (also for the Android target) and
    # tests.
    runs-on: ubuntu-latest
    # The same distribution as development, so the versions of GTK and
    # libadwaita match.
    container: fedora:44
    steps:
      - name: Install system dependencies
        # The checkout below needs git, which the container image lacks.
        run: |
          dnf install -y git
      - uses: actions/checkout@v4
      - run: ci/install-deps-fedora.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # The FFI crate's JNI code only compiles for Android.
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Clippy (Android FFI)
        # Check only, so no NDK is needed.
        run: cargo clippy -p specto-ffi --all-targets --target aarch64-linux-android
      - name: Test
        run: cargo test --workspace
      - name: Translation template
        # Crowdin gets its strings from the template, so it has to match the
        # code.
        run: apps/desktop/po/update-pot.sh --check

  deny:
    # The dependencies, against deny.toml: security advisories, licenses,
    # where crates come from. A new advisory can make this fail without any
    # change here, and deny.toml says how to record one that doesn't apply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    # The desktop app in a headless compositor, driven over D-Bus: see
    # apps/desktop/test-ui/check.py. At scale 1, fractional and HiDPI.
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git
      - uses: actions/checkout@v4
      - run: ci/install-deps-fedora.sh --headless
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the desktop app
        id: build
        run: cargo build -p specto-desktop
      - name: Scale 1
        run: apps/desktop/test-ui/run.sh python3 -I apps/desktop/test-ui/check.py
        env:
          SPECTO_CHECK_OUT: check-out/1
      - name: Scale 1.25
        # Run even if an earlier scale failed: each says something different.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: apps/desktop/test-ui/run.sh python3 -I apps/desktop/test-ui/check.py
        env:
          SPECTO_SCALE: "1.25"
          SPECTO_CHECK_OUT: check-out/1.25
      - name: Scale 2
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: apps/desktop/test-ui/run.sh python3 -I apps/desktop/test-ui/check.py
        env:
          SPECTO_SCALE: "2"
          SPECTO_CHECK_OUT: check-out/2
      - name: Upload screenshots of failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-check-screenshots
          path: check-out/
          if-no-files-found: ignore

  android:
    # Checks the style of the Kotlin code, builds the Android app (which
    # cross-compiles the Rust library and generates its Kotlin bindings) and
    # runs the Kotlin unit tests. The release build is built too: its code
    # shrinking (R8) fails on classes it can't account for, which the debug
    # build never shows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK
        # Must match `ndkVersion` in apps/android/build.gradle.kts. The
        # runner image ships the Android SDK. Gradle fetches the platform and
        # build tools itself once the licenses are accepted. `yes` ends with an
        # error when sdkmanager stops reading, hence the `|| true`.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin style
        working-directory: apps/android
        run: ./gradlew ktlintCheck
      - name: Build and unit tests
        working-directory: apps/android
        run: ./gradlew assembleDebug testDebugUnitTest assembleRelease

  android-ui:
    # The Android app's UI tests, on an emulator. Slow (the emulator renders
    # in software) and now and then flaky, so not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A failure on one shape says nothing about the other.
      fail-fast: false
      matrix:
        # A phone, and a tablet for the sidebar and two-page layouts (some
        # tests only apply to one of them).
        profile: [pixel_7, pixel_tablet]
    name: android-ui (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The emulator on these runners is x86-64, unlike phones.
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK
        # Must match `ndkVersion` in apps/android/build.gradle.kts.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - uses: gradle/actions/setup-gradle@v4
      - name: Let the emulator use hardware virtualization
        # Gives every user access to /dev/kvm. Without it the emulator falls
        # back to emulating the processor, which is far too slow.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # A released Android version (development uses newer ones).
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          # The app's own animations are part of what is tested.
          disable-animations: false
          working-directory: apps/android
          script: ./gradlew connectedDebugAndroidTest -Pspecto.abis=x86_64
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-report-${{ matrix.profile }}
          path: apps/android/build/reports/androidTests/connected/

