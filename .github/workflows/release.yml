name: Release

# A tag such as v0.1 builds the apps and publishes them as a GitHub release:
# the Flatpak of the desktop app for both architectures, and the signed APK of
# the Android app. packaging/README.md says how to make a release, and
# apps/android/BUILDING.md what the Android build needs.
on:
  push:
    tags: ["v*"]
  # "Run workflow" in the Actions tab builds the Flatpak bundles and the signed
  # APK without a release, to try the build before tagging.
  workflow_dispatch:

jobs:
  version:
    # The version of the apps, in the file VERSION: a major and a minor number.
    # A tag must name it, and the changelog and the metainfo must have an entry
    # for it.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        id: version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be a major and a minor number, not \"$version\""
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but VERSION has $version"
            exit 1
          fi
          if ! grep -q "<release version=\"$version\"" apps/desktop/data/net.xfbs.specto.metainfo.xml; then
            echo "::error::The metainfo has no release entry for $version"
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.}( |\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  flatpak:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    # Not Flathub's image with the SDK in it: flatpak-builder updates the SDK
    # first, which fails for one that is part of the image ("Invalid
    # cross-device link"). So the SDK is fetched anew each time, into a
    # directory outside the image. Privileged, because the build runs in a
    # sandbox of its own.
    container:
      image: fedora:44
      options: --privileged
    env:
      BUNDLE: specto-${{ needs.version.outputs.version }}-${{ matrix.variant.arch }}.flatpak
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git flatpak flatpak-builder python3
      - uses: actions/checkout@v4
      - name: List the crates
        # The build has no network: flatpak-builder downloads the crates of
        # Cargo.lock beforehand, from this list.
        run: python3 packaging/flatpak/cargo-sources.py Cargo.lock packaging/flatpak/cargo-sources.json
      - name: Build
        # Under target, which the manifest leaves out of the sources it copies
        # from this directory. No FUSE in the container.
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --disable-rofiles-fuse --default-branch=stable \
            --repo=target/flatpak/repo --state-dir=target/flatpak/state \
            target/flatpak/build packaging/flatpak/net.xfbs.specto.yml
      - name: Bundle
        # One file to install, which says where the runtime comes from.
        run: |
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            target/flatpak/repo "$BUNDLE" net.xfbs.specto stable
      - uses: actions/upload-artifact@v4
        with:
          name: specto-flatpak-${{ matrix.variant.arch }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up the release key
        # Without the key the build would be signed with a debug key, which
        # must never be handed out: an update needs the key of the version it
        # replaces.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::A secret for the release key is missing (see BUILDING.md)"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # A properties file reads a backslash as the start of an escape.
          escaped() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$(escaped "$STORE_PASSWORD")"
            echo "keyAlias=$(escaped "$KEY_ALIAS")"
            echo "keyPassword=$(escaped "$KEY_PASSWORD")"
          } > apps/android/keystore.properties
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK
        # Must match `ndkVersion` in apps/android/build.gradle.kts.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Check the signature
        # The APK must verify, and not with a debug key.
        run: |
          apk=$(ls apps/android/build/outputs/apk/release/*.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q "Android Debug" certs.txt; then
            echo "::error::The APK is signed with a debug key"
            exit 1
          fi
          cp "$apk" "specto-$VERSION.apk"
          sha256sum "specto-$VERSION.apk" > "specto-$VERSION.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: specto-android
          path: |
            specto-${{ needs.version.outputs.version }}.apk
            specto-${{ needs.version.outputs.version }}.apk.sha256
          if-no-files-found: error

  release:
    # The GitHub release for the tag, with everything that was built, and the
    # version's section of the changelog as its notes.
    if: github.ref_type == 'tag'
    needs: [version, flatpak, android]
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the files.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, to find the one before.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: specto-*
          merge-multiple: true
      - name: Notes
        # The version's section of the changelog, up to the next heading of a
        # version, and a link to the commits since the release before. GitHub
        # shows every line break of release notes, so the lines a paragraph or
        # an item is wrapped into are joined.
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            !found { next }
            /^ +[^ ]/ || (/^[^-#[:space:]]/ && text != "" && text !~ /^#/) {
              sub(/^ +/, ""); text = text " " $0; next
            }
            { if (started) print text; text = $0; started = 1 }
            END { if (started) print text }
          ' CHANGELOG.md > notes.md
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            printf '\nAll changes: https://github.com/%s/compare/%s...%s\n' \
              "$GH_REPO" "$previous" "$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md
      - name: Checksums of the bundles
        run: |
          for bundle in specto-*.flatpak; do
            sha256sum "$bundle" > "$bundle.sha256"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md \
            --title "Specto $VERSION" specto-*.flatpak specto-*.apk specto-*.sha256
