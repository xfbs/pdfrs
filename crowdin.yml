# What Crowdin translates, for the Crowdin command-line tool and the action in
# .github/workflows/translations.yml. The project and the token come from the
# environment, never from this file.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  # The Android app: a copy of the English file for each language.
  - source: /apps/android/res/values/strings.xml
    translation: /apps/android/res/values-%two_letters_code%/%original_file_name%
  # The desktop app: a catalog for each language, from the template.
  - source: /apps/desktop/po/specto.pot
    translation: /apps/desktop/po/%two_letters_code%.po
