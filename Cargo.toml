[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "apps/desktop"]

[workspace.package]
# The version of the crates. The apps have their own, in the file VERSION.
version = "0.1.0"
edition = "2024"
rust-version = "1.92" # what hayro 0.9 requires
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The version only says that these are not "any version" dependencies
# (cargo-deny checks for those). Keep it equal to `version` above.
specto-geom = { path = "crates/specto-geom", version = "0.1.0" }
specto-source = { path = "crates/specto-source", version = "0.1.0" }
specto-render = { path = "crates/specto-render", version = "0.1.0" }
specto-view = { path = "crates/specto-view", version = "0.1.0" }
specto-text = { path = "crates/specto-text", version = "0.1.0" }
specto-annot = { path = "crates/specto-annot", version = "0.1.0" }
specto-doc = { path = "crates/specto-doc", version = "0.1.0" }
specto-forms = { path = "crates/specto-forms", version = "0.1.0" }
specto-session = { path = "crates/specto-session", version = "0.1.0" }
specto-write = { path = "crates/specto-write", version = "0.1.0" }
specto-store = { path = "crates/specto-store", version = "0.1.0" }
hayro = "0.9"
anyhow = "1"
thiserror = "2"
uniffi = "0.32"
clap = { version = "4", features = ["derive"] }
# PNG only, which keeps the decoders of other image formats out of the build.
image = { version = "0.25", default-features = false, features = ["png"] }
wait-timeout = "0.2"
# "rc" for the shared annotations of the edit model, which drafts store.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
libc = "0.2"

[workspace.lints.rust]
# Unsafe code needs an `allow` where it is used: the memory mapping and the JNI
# functions.
unsafe_code = "deny"

[workspace.lints.clippy]
# The lower priority lets a single lint be set differently below this line.
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2 # the rendering dependencies are painfully slow unoptimized
